name: Build DailyFit Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free build and calendar packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Embed release version
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          "APP_VERSION = `"$version`"" | Out-File -FilePath version_info.py -Encoding utf8

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DailyFit --collect-all winotify --collect-all nepdate --collect-all nepdate_patro --add-data "THIRD_PARTY_NOTICES.md;." dailyfit.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\DailyFit.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DailyFit.exe" | Out-File .\dist\DailyFit.exe.sha256 -Encoding ascii

      - name: Attach EXE and checksum to this GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ github.event.release.tag_name }}" .\dist\DailyFit.exe .\dist\DailyFit.exe.sha256 --clobber
